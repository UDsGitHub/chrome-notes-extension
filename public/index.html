<html>
  <head>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header><h2>Notes</h2></header>
    <main>
      <p class="notes-empty">No notes yet. Add one below.</p>
      <ul class="notes-list" hidden></ul>
      <form id="notes-form">
        <button class="cancel-edit-btn" hidden>Cancel</button>
        <div class="notes-input-wrapper">
          <textarea
            id="notes-input"
            name="notes-input"
            placeholder="Enter your note..."
            required
            autofocus
          ></textarea>
          <button id="notes-input-submit">
            <svg
              class="icon"
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              fill="none"
              viewBox="0 0 24 24"
            >
              <path
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1"
                d="m9 5 7 7-7 7"
              />
            </svg>
          </button>
        </div>
      </form>
    </main>
  </body>
  <template id="notes-list-item-template">
    <li class="notes-list-item">
      <p class="notes-content"></p>
      <button class="notes-actions-button copy-btn">
        <svg
          class="icon"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          fill="none"
          viewBox="0 0 24 24"
        >
          <path
            stroke="currentColor"
            stroke-linejoin="round"
            stroke-width="1"
            d="M9 8v3a1 1 0 0 1-1 1H5m11 4h2a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1h-7a1 1 0 0 0-1 1v1m4 3v10a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-7.13a1 1 0 0 1 .24-.65L7.7 8.35A1 1 0 0 1 8.46 8H13a1 1 0 0 1 1 1Z"
          />
        </svg>
      </button>
      <button class="notes-actions-button delete-btn">
        <svg
          class="icon"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          fill="none"
          viewBox="0 0 24 24"
        >
          <path
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1"
            d="M6 18 17.94 6M18 18 6.06 6"
          />
        </svg>
      </button>
    </li>
  </template>
  <script type="module" src="../dist/index.js"></script>
</html>
