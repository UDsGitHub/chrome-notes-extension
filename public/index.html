<html>
  <head>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header><h2>Notes</h2></header>
    <main>
      <p class="notes-empty">No notes yet. Add one below.</p>
      <ul class="notes-list" hidden></ul>
      <form id="notes-form">
        <button class="cancel-edit-btn" hidden>Cancel</button>
        <div class="notes-input-wrapper">
          <textarea
            id="notes-input"
            name="notes-input"
            placeholder="Enter your note..."
            required
            autofocus
          ></textarea>
          <button id="notes-input-submit">
            <svg
              class="icon"
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m5 12 7-7 7 7" />
              <path d="M12 19V5" />
            </svg>
          </button>
        </div>
      </form>
    </main>
  </body>
  <template id="notes-list-item__template">
    <li class="notes-list-item">
      <p class="notes-list-item__content"></p>
      <button class="notes-list-item__action edit-btn">
        <svg
          class="icon"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          fill="none"
          viewBox="0 0 24 24"
        >
          <path
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="m14.304 4.844 2.852 2.852M7 7H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-4.5m2.409-9.91a2.017 2.017 0 0 1 0 2.853l-6.844 6.844L8 14l.713-3.565 6.844-6.844a2.015 2.015 0 0 1 2.852 0Z"
          />
        </svg>
      </button>
      <button class="notes-list-item__action delete-btn">
        <svg
          class="icon"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          fill="none"
          viewBox="0 0 24 24"
        >
          <path
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1"
            d="M6 18 17.94 6M18 18 6.06 6"
          />
        </svg>
      </button>
      <span class="notes-list-item__indicator">copied</span>
    </li>
  </template>
  <script type="module" src="../dist/index.js"></script>
</html>
